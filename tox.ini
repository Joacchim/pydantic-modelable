[tox]
envlist = typecheck,lint,format,func,plugin
# Before 4.3.3, the requires for tox plugins didnt work properly
# See: https://github.com/tox-dev/tox/issues/2862
min_version = 4.3.3
requires =
    tox-ignore-env-name-mismatch ~= 0.2.0
no_package=true

[pytest]
minversion = 6.0
addopts = -vs

[testenv]
envdir = {work_dir}/common
runner = ignore_env_name_mismatch
deps =
    .
    .[test]
    .[doc]

[testenv:typecheck]
commands =
    mypy --strict pydantic_modelable tests/

[testenv:lint]
commands =
    ruff check ./pydantic_modelable tests/ ./pydantic_modelable_mypy {posargs}

[testenv:format]
commands =
    ruff format ./pydantic_modelable tests/ ./pydantic_modelable_mypy {posargs}

[testenv:func]
envdir = {work_dir}/autoreset
allowlist_externals = sh
deps =
    -e .[test]
commands =
    pip install -e ./tests/python_packages/core
    pip install -e ./tests/python_packages/ext1
    pip install -e ./tests/python_packages/ext2
    pytest tests/func

[testenv:plugin]
# The plugin has its own dependency set (mypy internals, the runtime library it
# supports) and is a separately-released distribution, so it gets an isolated
# environment rather than sharing the common one. Its tests live under the
# top-level tests/ tree but need the plugin installed, hence this dedicated env.
envdir = {work_dir}/plugin
deps =
    -e .
    -e ./pydantic_modelable_mypy[test]
commands =
    mypy --strict pydantic_modelable_mypy/pydantic_modelable_mypy
    pytest tests/mypy_plugin {posargs}

[testenv:doc]
commands =
    mkdocs {posargs:build}
